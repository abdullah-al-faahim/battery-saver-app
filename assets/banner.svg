<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Battery Saver: find battery-draining apps and stop them">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1A16"/>
      <stop offset="1" stop-color="#11291E"/>
    </linearGradient>
    <radialGradient id="glow" cx=".18" cy=".5" r=".45">
      <stop offset="0" stop-color="#2BC883" stop-opacity=".35"/>
      <stop offset="1" stop-color="#2BC883" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2BC883"/>
      <stop offset="1" stop-color="#168A53"/>
    </linearGradient>
  </defs>
  <rect width="900" height="260" rx="24" fill="url(#bg)"/>
  <rect width="900" height="260" rx="24" fill="url(#glow)"/>

  <!-- app icon -->
  <g transform="translate(70 50)">
    <rect width="160" height="160" rx="40" fill="url(#ic)"/>
    <g transform="translate(0 0) scale(1.48)">
      <path d="M44,32h20a4,4 0,0 1,4 4v42a4,4 0,0 1,-4 4h-20a4,4 0,0 1,-4 -4v-42a4,4 0,0 1,4 -4z" fill="none" stroke="#FFFFFF" stroke-width="4"/>
      <path d="M49,25h10v5h-10z" fill="#FFFFFF"/>
      <path d="M57,40L46,59h7l-3,14l11,-20h-7z" fill="#FFFFFF"/>
    </g>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <text x="275" y="112" fill="#FFFFFF" font-size="52" font-weight="800">Battery Saver</text>
    <text x="277" y="152" fill="#B9D8C8" font-size="21">Find the apps eating your battery and stop them.</text>
    <text x="277" y="180" fill="#B9D8C8" font-size="21">Even the ones Android won’t let you turn off.</text>
    <g font-size="14" font-weight="600">
      <rect x="277" y="200" width="88" height="28" rx="14" fill="#2BC883" fill-opacity=".16"/>
      <text x="321" y="219" fill="#5FE0A5" text-anchor="middle">55 KB</text>
      <rect x="375" y="200" width="98" height="28" rx="14" fill="#2BC883" fill-opacity=".16"/>
      <text x="424" y="219" fill="#5FE0A5" text-anchor="middle">No root</text>
      <rect x="483" y="200" width="112" height="28" rx="14" fill="#2BC883" fill-opacity=".16"/>
      <text x="539" y="219" fill="#5FE0A5" text-anchor="middle">No internet</text>
      <rect x="605" y="200" width="88" height="28" rx="14" fill="#2BC883" fill-opacity=".16"/>
      <text x="649" y="219" fill="#5FE0A5" text-anchor="middle">No ads</text>
    </g>
  </g>
</svg>
